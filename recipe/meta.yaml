{% set name = "pytest-split" %}
{% set version = "0.11.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/jerry-git/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 43b695c90d888fee2e66365a01d508aa5792727d7968892d790cebc0dd79afc9

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - python
    - poetry-core >=1.0.0
    - pip
  run:
    - python
    - pytest >=5,<10

test:
  source_files:
    - tests
  requires:
    - pip
    - pytest
  imports:
    - pytest_split
  commands:
    - pip check
    # Verify pytest-split is registered as a pytest plugin via its `pytest11`
    # entry point (not just importable). We query importlib.metadata directly
    # instead of grepping `pytest --traceconfig` output, which is unstable
    # across pytest versions and silently no-ops under `set -e` when the
    # version string drifts. .load() also catches a registered-but-broken
    # entry point.
    - python -c "from importlib.metadata import entry_points; eps=[ep for ep in entry_points(group='pytest11') if ep.name=='pytest-split']; assert eps, list(entry_points(group='pytest11')); ep=eps[0].load(); assert ep.__name__=='pytest_split.plugin', ep.__name__"
    - pytest -v tests -k "not (test_returns_nonzero_when_invalid_algorithm_name)"

about:
  home: https://github.com/jerry-git/pytest-split
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: pytest plugin to split tests based on execution time.
  description: |
    pytest plugin which splits the test suite to equally sized "sub suites" based on test execution time.
  doc_url: https://github.com/jerry-git/pytest-split
  dev_url: https://github.com/jerry-git/pytest-split

extra:
  recipe-maintainers:
    - ma-sadeghi
